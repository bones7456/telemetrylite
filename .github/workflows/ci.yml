name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  # 推送 v* 标签时:交叉编译 Linux 静态二进制并发布 Release(附 SHA256SUMS 与 install.sh)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - run: pip3 install cargo-zigbuild   # 同时带上 zig
      - name: Build
        run: |
          mkdir dist
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked --target "$arch-unknown-linux-musl"
            cp "target/$arch-unknown-linux-musl/release/telemetrylite" "dist/telemetrylite-$arch-linux"
          done
          # 把仓库名写进安装脚本,用户无需再指定
          sed "s|__REPO__|$GITHUB_REPOSITORY|" scripts/install.sh > dist/install.sh
          (cd dist && sha256sum telemetrylite-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
