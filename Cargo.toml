[package]
name = "telemetrylite"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
flate2 = "1.1.11"
hex = "0.4.3"
maxminddb = { version = "0.32.0", features = ["mmap"] }
prost = "0.14.4"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.5.1"
uuid = { version = "1.29.1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
