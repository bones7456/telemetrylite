<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TelemetryLite</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mute:#6b7585;--line:#e3e7ee;--accent:#2f6fed;--bar:#cfe0ff;--danger:#d23b3b;--warn:#b45309;--warnbg:rgba(245,158,11,.13);--hover:rgba(0,0,0,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1a2029;--fg:#e6e9ef;--mute:#8f9aac;--line:#2a3340;--accent:#6b9bff;--bar:#27406e;--danger:#ff7676;--warn:#fbbf24;--warnbg:rgba(251,191,36,.12);--hover:rgba(255,255,255,.18)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:var(--accent);text-decoration:none;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:16px}header .sp{flex:1}
header select{padding:2px 6px;font-size:13px}
.row .sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:24px}
h2{margin:0 0 16px;font-size:20px}h3{margin:0 0 12px;font-size:14px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid .card{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.tile b{display:block;font-size:28px}.tile span{color:var(--mute)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;color:var(--mute);border-bottom:2px solid transparent}
.tabs a.on{color:var(--fg);border-color:var(--accent)}
.bar{position:relative;padding:3px 8px;margin:2px 0;border-radius:4px;display:flex;justify-content:space-between;gap:8px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);z-index:0}
.bar span{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span+span{color:var(--mute);flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--accent);border-color:var(--accent);color:#fff}button.d{color:var(--danger)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}td.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto;font-size:12px;margin:8px 0}
.mute{color:var(--mute)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
svg{width:100%;height:auto;display:block}
textarea{width:100%;font:12px/1.5 ui-monospace,Menlo,monospace;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical}
summary{cursor:pointer}
.summary{display:flex;gap:32px;flex-wrap:wrap;margin:0 0 16px}.summary div{display:flex;flex-direction:column}.summary b{font-size:18px}
.banner{background:rgba(242,169,59,.13);border:1px solid rgba(242,169,59,.55);border-radius:8px;padding:8px 12px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
table.heat{font-size:12px}.heat th,.heat td{padding:3px 6px;text-align:center;white-space:nowrap}.heat th:first-child,.heat td:first-child{text-align:left}.heat td.cell{border:2px solid var(--card)}
th.num,td.num{text-align:right}
.seg{transition:opacity .12s}.legend span{transition:opacity .12s}
.hit{fill:transparent}.hit:hover{fill:var(--hover)}
.tip{position:fixed;z-index:50;display:none;pointer-events:none;min-width:190px;max-width:340px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.3);font-size:13px}
.tip .tt{font-weight:700;font-size:14px;padding:9px 14px;border-bottom:1px solid var(--line)}.tip .tb{padding:6px 0}
.tip .tr{display:flex;align-items:center;gap:9px;padding:3px 14px}.tip .tr i{width:10px;height:10px;border-radius:50%;flex:none}
.tip .tr.act{background:var(--hover)}.tip .tr.act .tl{color:var(--fg);font-weight:700}
.tip .ln{padding:3px 14px;font-size:14px}.tip .ln.mute{font-size:12px;color:var(--mute)}
.heat td.cell:hover{outline:2px solid var(--fg);outline-offset:-2px}
.tip .tl{flex:1;color:var(--mute)}.tip .tv{font-weight:700;font-variant-numeric:tabular-nums;margin-left:12px}
.banner-actions{display:flex;gap:8px;align-items:center}.banner .x{border:none;background:transparent;font-size:20px;line-height:1;padding:0 6px;color:var(--mute)}.banner .x:hover{color:var(--fg)}
.card.warn{border:2px solid var(--warn);background:var(--warnbg)}.warn-title{font-size:17px;font-weight:700;color:var(--warn);margin-bottom:10px}
pre.keybox{font-size:15px;font-weight:700;border:1px dashed var(--warn);background:var(--card);padding:10px 12px;user-select:all;word-break:break-all;white-space:pre-wrap}
@media(max-width:700px){.tiles,.two{grid-template-columns:1fr}.summary{gap:16px}header{padding:12px 16px}}
</style>
</head>

    danger: 'Danger zone', deleteApp: 'Delete app and all its data',

    agentHint: 'Copy this prompt into Claude Code, Codex or Cursor, from the root of your app repository. The server URL and app id are filled in. The key is shown only once: issue a new key above and it is filled in automatically.',

with the TelemetryDeck SDKs.

Values (never invent them; if one is still a <placeholder>, ask me):
- Server URL: <SERVER_URL>
- Write key:  <WRITE_KEY>
- App ID:     <APP_ID>
Use these same values on every platform of this app (iOS, Android, ...): do not create a second
app. The admin UI tells the platforms apart by itself.

Steps:

2. Integrate, once at app launch:
   - Swift (iOS/macOS/watchOS/tvOS/visionOS): add the Swift package
     https://github.com/TelemetryDeck/SwiftSDK (Up to Next Major, library "TelemetryDeck"), then
         import TelemetryDeck
         let config = TelemetryDeck.Config(appID: "<APP_ID>", baseURL: URL(string: "<SERVER_URL>/k/<WRITE_KEY>/")!)
         TelemetryDeck.initialize(config: config)
         TelemetryDeck.signal("App.launched")
   - Other platforms: add that platform's official TelemetryDeck SDK and set its custom API base URL
     to  <SERVER_URL>/k/<WRITE_KEY>/  (keep the trailing slash; the SDK appends "v2/" itself).
     If the SDK has no such option, use plain HTTP instead:
         POST <SERVER_URL>/k/<WRITE_KEY>/v2/   Content-Type: application/json
         body: [{"appID":"<APP_ID>","clientUser":"<anonymous user id>","sessionID":"<session id>",
                 "type":"App.launched","payload":{},"isTestMode":"true"}]
   - Already using OpenTelemetry? Export Logs over OTLP/HTTP instead:
     endpoint <SERVER_URL>/v1/logs, header "Authorization: Bearer <WRITE_KEY>", event name in

3. Build the project, and check that the server accepts the key (expect HTTP 200):
     curl -i -X POST "<SERVER_URL>/k/<WRITE_KEY>/v2/" -H 'content-type: application/json' \
       -d '[{"type":"Integration.test","clientUser":"agent-test","sessionID":"s1","isTestMode":"true","payload":{}}]'
   (401 = wrong key, 503 = busy.) Then tell me how to see the event: admin UI -> your app ->
   Events page (it includes test data).
4. Keep the change minimal: only what is needed to connect. Do not add other events or refactor.`,
    dismiss: 'Dismiss',
    retAfter: (p, n) => n === 0 ? `${p}% in the first week` : `${p}% after ${n} week${n === 1 ? '' : 's'}`, retFirst: d => `First appeared the week of ${d}`, retCount: (u, s) => `${u} of ${s} users`,
    allPlatforms: 'All platforms', platformLabel: 'Platform',
    refresh: 'Refresh', autoRefresh: 'Auto refresh', autoOff: 'Off (manual)', auto10: 'Every 10 s', auto30: 'Every 30 s',
    auto60: 'Every 1 min', auto300: 'Every 5 min', updatedAt: ts => `Updated ${ts}`, refreshFailed: 'Refresh failed',
  },
  zh: {
    logout: '退出', adminPassword: '管理员密码', login: '登录', wrongPassword: '密码错误',
    newAppName: '新 App 名称', create: '创建', noApps: '还没有 App,先创建一个。', events24h: ' 事件 / 24h',
    tabOverview: '概览', tabUsers: '用户', tabEvents: '事件', tabTypes: '事件类型', tabErrors: '错误', tabSettings: '设置',
    range1: '24 小时', range7: '7 天', range30: '30 天', range90: '90 天', live: '正式数据', testData: '测试数据',
    activeUsers: '活跃用户', events: '事件', sessions: '会话', lastHour: '最近 1 小时用户数',
    topEvents: '热门事件', noData: '暂无数据', unknown: '(未知)', usersSuffix: ' · 用户数', nUsers: n => `${n} 用户`,

    dim_locale: '语言/地区', dim_country: '国家', dim_city: '城市',
    sumUsers: '用户', sumSdk: '最常用 SDK', sumErrors: '错误', sumHint: '最近 90 天,正式数据',
    hiddenTest: n => `当前查看的是正式数据,另有 ${n} 条测试事件未显示。`,
    hiddenLive: n => `当前查看的是测试数据,另有 ${n} 条正式事件未显示。`,
    switchTest: '切换到测试数据', switchLive: '切换到正式数据',
    retentionTitle: '用户留存(按周的队列)', cohort: '队列', weekN: n => `第 ${n} 周`,
    versionsTitle: 'App 版本随时间变化(用户占比)', other: '其他',
    newUsers: '新用户', returning: '回访用户', newVsReturning: '新用户 vs 回访用户',
    newNote: '用户的第一条事件出现在已存储的数据里的那一天,算作新用户。',
    colType: '事件', colUsers: '用户', colEvents: '事件数', colLast: '最近一次',
    errorsTitle: '错误趋势', errId: '错误', errCategory: '类别', errMessage: '信息', noErrors: '这个时间范围内没有错误。',
    errorsNote: '统计 SDK 预设的 TelemetryDeck.Error.occurred 事件。',
    loadMore: '加载更多', filterPh: '按事件名过滤(精确匹配)', filterHint: '回车确认;含测试数据',
    colTime: '时间', colEvent: '事件', colEnv: '环境', colParams: '参数',
    sysParams: n => `系统参数 (${n})`,
    basicInfo: '基本信息', retention: '数据保留', daysUnit: '天', save: '保存', appId: 'App ID: ',
    writeKeys: '写入 API key(只能写入,不能读取)', keyLabelPh: '名称,如 ios-prod', labelRequired: '名称必填。', issueKey: '签发新 key',
    colLabel: '名称', colPrefix: '前缀', colCreated: '创建时间', revoked: '已吊销', revoke: '吊销',
    revokeConfirm: '吊销后使用该 key 的客户端将无法上报,确定?',
    newKeyTitle: '新 key(仅显示这一次,请立即保存)',
    danger: '危险操作', deleteApp: '删除 App 及全部数据',
    deleteConfirm: name => `删除 App「${name}」及其全部数据?不可恢复。`,
    error: '出错了:',
    agentTitle: '让 AI agent 完成接入',
    agentHint: '在你的 App 仓库根目录,把这段提示词复制给 Claude Code、Codex 或 Cursor。服务器地址和 App ID 已自动填好。key 只显示一次:在上方签发新 key 后会自动填进去。',
    agentNoKey: '写入 key 还没填入,请先在上方签发新 key。', agentKeyFilled: '新签发的 key 已填入。',
    agentCopy: '复制提示词', agentCopied: '已复制',
    agentPrompt: String.raw`把这个项目接入我自托管的 TelemetryLite 统计服务,它兼容 TelemetryDeck SDK。

参数(不要自己编造;如果下面仍是 <占位符>,先问我):
- 服务器地址: <SERVER_URL>
- 写入 key:   <WRITE_KEY>
- App ID:     <APP_ID>
这个应用的所有平台(iOS、Android 等)都使用同样的这三个值:不要另建应用。管理界面会自己区分平台。

步骤:
1. 识别平台和构建系统。修改文件之前,先说明你要用下面哪种方式。
2. 在 App 启动时集成(只初始化一次):
   - Swift(iOS/macOS/watchOS/tvOS/visionOS):添加 Swift Package
     https://github.com/TelemetryDeck/SwiftSDK(Up to Next Major,库选 "TelemetryDeck"),然后
         import TelemetryDeck
         let config = TelemetryDeck.Config(appID: "<APP_ID>", baseURL: URL(string: "<SERVER_URL>/k/<WRITE_KEY>/")!)
         TelemetryDeck.initialize(config: config)
         TelemetryDeck.signal("App.launched")
   - 其他平台:添加该平台官方的 TelemetryDeck SDK,并把它的自定义 API base URL 设为
     <SERVER_URL>/k/<WRITE_KEY>/ (保留末尾斜杠;SDK 会自己拼上 "v2/")。
     如果 SDK 没有这个选项,改用纯 HTTP:
         POST <SERVER_URL>/k/<WRITE_KEY>/v2/   Content-Type: application/json
         body: [{"appID":"<APP_ID>","clientUser":"<匿名用户 id>","sessionID":"<会话 id>",
                 "type":"App.launched","payload":{},"isTestMode":"true"}]
   - 项目已在用 OpenTelemetry?改用 OTLP/HTTP 导出 Logs:
     endpoint <SERVER_URL>/v1/logs,请求头 "Authorization: Bearer <WRITE_KEY>",事件名放在
     LogRecord.event_name。
3. 构建项目,并确认服务器接受这个 key(应返回 HTTP 200):
     curl -i -X POST "<SERVER_URL>/k/<WRITE_KEY>/v2/" -H 'content-type: application/json' \
       -d '[{"type":"Integration.test","clientUser":"agent-test","sessionID":"s1","isTestMode":"true","payload":{}}]'
   (401 = key 错误,503 = 服务繁忙。)然后告诉我在哪里看到这条事件:管理界面 → 你的 App →
   「事件」页(包含测试数据)。
4. 改动保持最小:只做接入所需的部分,不要添加其他事件,也不要重构。`,
    dismiss: '关闭',
    retAfter: (p, n) => n === 0 ? `首周 ${p}%` : `${n} 周后留存 ${p}%`, retFirst: d => `首次出现于 ${d} 当周`, retCount: (u, s) => `${s} 人中的 ${u} 人`,
    allPlatforms: '全部平台', platformLabel: '平台',
    refresh: '刷新', autoRefresh: '自动刷新', autoOff: '关闭(手动)', auto10: '每 10 秒', auto30: '每 30 秒',
    auto60: '每 1 分钟', auto300: '每 5 分钟', updatedAt: ts => `更新于 ${ts}`, refreshFailed: '刷新失败',
  },
};
// 默认英语;用户选择的语言记在浏览器本地(存储不可用时退回英语)
let lang = 'en';
try { if (localStorage.getItem('lang') === 'zh') lang = 'zh'; } catch {}
document.documentElement.lang = lang;
const t = (k, ...a) => { const v = I18N[lang][k] ?? I18N.en[k] ?? k; return typeof v === 'function' ? v(...a) : v; };
const langSelect = () => h('select', {
  'aria-label': 'Language',
  onchange: e => {
    lang = e.target.value; document.documentElement.lang = lang;
    try { localStorage.setItem('lang', lang); } catch {}
    route();
  },
}, [['en', 'English'], ['zh', '中文']].map(([v, l]) => h('option', { value: v, selected: v === lang }, l)));

const $app = document.getElementById('app');
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
};
const api = async (method, path, body) => {
  const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
  if (r.status === 401 && path !== '/login') { location.hash = '#/login'; throw new Error('unauth'); }
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const loc = () => lang === 'zh' ? 'zh-CN' : 'en-US';
const when = ts => new Date(ts).toLocaleString(loc());
// ISO country code -> name in the UI language (browser built-in); falls back to the code.
const regionNames = {};
const countryName = c => {
  if (!c) return c;
  try { return ((regionNames[lang] ??= new Intl.DisplayNames([loc()], { type: 'region' })).of(c)) || c; } catch { return c; }
};
const cityName = c => c && c.replace(/ \(.*\)$/, '');   // older rows may still carry a district suffix
// Values that come from clients (versions, labels …) must be escaped before they go into SVG/HTML strings.
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Dismissible hints: remembered in the browser per app and view; falls back to this page load if storage is unavailable.
const dismissed = new Set();
const hintHidden = k => dismissed.has(k) || (() => { try { return localStorage.getItem(k) === '1'; } catch { return false; } })();
const hintDismiss = k => { dismissed.add(k); try { localStorage.setItem(k, '1'); } catch {} };

// ---- query state shared by the data pages ----
const getQ = () => { try { return JSON.parse(sessionStorage.getItem('q')) || { days: 7, test: 0 }; } catch { return { days: 7, test: 0 }; } };
const setQ = (k, v) => { const q = getQ(); q[k] = v; try { sessionStorage.setItem('q', JSON.stringify(q)); } catch {} };
const tzMin = () => -new Date().getTimezoneOffset();
const qs = q => `days=${q.days}&test=${q.test}&tz=${tzMin()}&platform=${encodeURIComponent(q.platform || '')}`;
// The saved platform only counts if this app has seen it.
const curQ = app => { const q = getQ(); if (q.platform && !(app.platforms || []).some(p => p.os === q.platform)) q.platform = ''; return q; };
// Platform filter (iOS / Android / …): only shown when the app has data from more than one platform.
const platformSelect = (app, onchange) => app.platforms.length < 2 ? null : h('select', { title: t('platformLabel'), 'aria-label': t('platformLabel'),
  onchange: e => { setQ('platform', e.target.value); onchange(); } },
  [h('option', { value: '' }, t('allPlatforms')), ...app.platforms.map(p => h('option', { value: p.os, selected: p.os === curQ(app).platform }, p.os))]);

// ---- charts ----
// Time buckets in the browser's local time zone, so a range with little data still spans the whole axis.
const pad2 = n => String(n).padStart(2, '0');
function bucketKeys(days) {
  const hourly = days <= 1, step = (hourly ? 3600 : 86400) * 1000, tz = tzMin() * 60000;
  const key = x => { const d = new Date(x); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}` + (hourly ? ` ${pad2(d.getUTCHours())}:00` : ''); };
  const now = Date.now() + tz, out = [];
  for (let x = Math.floor((now - days * 86400000) / step) * step; x <= now; x += step) out.push(key(x));
  return out;
}
const fillSeries = (series, days) => { const by = Object.fromEntries(series.map(s => [s.t, s])); return bucketKeys(days).map(k => by[k] || { t: k, events: 0, users: 0 }); };

const PALETTE = ['#4c78ff', '#35b6a3', '#f2a93b', '#e4572e', '#9b6bdf', '#5dc0e8', '#8fbf3f', '#e86fa3'], OTHER = '#8a94a6';
const G = { W: 600, H: 160, L: 32, R: 6, T: 8, B: 20 };
// Axis: grid lines with value labels, first/last bucket label underneath.
function axis(ticks, y, labels, fmtTick = fmt) {
  const { W, H, L, R } = G;
  return ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end" font-size="10" fill="var(--mute)">${fmtTick(v)}</text>`).join('') +
    (labels.length ? `<text x="${L}" y="${H - 5}" font-size="10" fill="var(--mute)">${esc(labels[0])}</text><text x="${W - R}" y="${H - 5}" text-anchor="end" font-size="10" fill="var(--mute)">${esc(labels.at(-1))}</text>` : '');
}
const ticksFor = max => max <= 2 ? [0, max] : [0, Math.round(max / 2), max];
const svgBox = inner => { const d = h('div'); d.innerHTML = `<svg viewBox="0 0 ${G.W} ${G.H}">${inner}</svg>`; return d; };

// ---- hover card (shared by all charts) ----
// A card that follows the mouse: bold date, then one row per series (colour dot, name, bold value). The hovered column is highlighted.
const bucketTitle = k => {
  const m = k.match(/^(\d{4})-(\d\d)-(\d\d)(?: (\d\d):00)?$/);
  if (!m) return k;
  const d = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0)), o = { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' };
  return m[4] ? d.toLocaleString(loc(), { ...o, hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString(loc(), o);
};
let tipEl = null;
const hideTip = () => { if (tipEl) tipEl.style.display = 'none'; };
function showTip(info, e) {
  if (!tipEl) { tipEl = h('div', { class: 'tip' }); document.body.append(tipEl); }
  tipEl.replaceChildren(...(info.title ? [h('div', { class: 'tt' }, info.title)] : []),
    h('div', { class: 'tb' }, info.lines ? info.lines.map(l => h('div', { class: l.mute ? 'ln mute' : 'ln' }, l.text))
      : info.rows.map(r => h('div', { class: r.active ? 'tr act' : 'tr' }, h('i', { style: `background:${r.color}` }), h('span', { class: 'tl' }, r.label), h('span', { class: 'tv' }, r.value)))));
  tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, hgt = tipEl.offsetHeight;   // keep the card inside the window
  tipEl.style.left = Math.max(8, Math.min(e.clientX + 16, innerWidth - w - 8)) + 'px';
  tipEl.style.top = Math.max(8, e.clientY + 16 + hgt > innerHeight ? e.clientY - hgt - 12 : e.clientY + 16) + 'px';
}
// info(i) -> { title?, rows: [{ color, label, value }] } or { title?, lines: [{ text, mute? }] }; hit elements carry data-i.
function bindTip(box, info, onHide) {
  const hide = () => { hideTip(); if (onHide) onHide(); };
  box.addEventListener('mousemove', e => { const i = e.target.dataset && e.target.dataset.i; if (i === undefined) hide(); else showTip(info(+i, e), e); });
  box.addEventListener('mouseleave', hide);
  return box;
}
// Pointer position in the SVG's own coordinate system (the chart is scaled by CSS).
const svgPoint = (svg, e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
const num = n => Number(n).toLocaleString(loc());
const hitRects = (n, L, step, T, ih) => Array.from({ length: n }, (_, i) => `<rect class="hit" data-i="${i}" x="${L + step * i}" y="${T}" width="${step}" height="${ih}"/>`).join('');

// Line or bar chart of one metric; `name` labels the value in the hover card.
function chart(series, key, bars, name) {
  const { W, L, R, T, B, H } = G, iw = W - L - R, ih = H - T - B, n = Math.max(series.length, 1), step = iw / n;
  const max = Math.max(1, ...series.map(s => s[key])), y = v => T + ih - v / max * ih, cx = i => L + step * i + step / 2;
  let body;
  if (bars) {
    const w = Math.min(28, Math.max(2, step - 2));
    body = series.map((s, i) => `<rect x="${cx(i) - w / 2}" y="${y(s[key])}" width="${w}" height="${T + ih - y(s[key])}" fill="var(--accent)" opacity=".85"/>`).join('');
  } else {
    body = `<polyline points="${series.map((s, i) => `${cx(i)},${y(s[key])}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>` +
      series.map((s, i) => `<circle cx="${cx(i)}" cy="${y(s[key])}" r="2.5" fill="var(--accent)"/>`).join('');
  }
  return bindTip(svgBox(axis(ticksFor(max), y, series.map(s => s.t)) + body + hitRects(series.length, L, step, T, ih)),
    i => ({ title: bucketTitle(series[i].t), rows: [{ color: 'var(--accent)', label: name || key, value: num(series[i][key]) }] }));
}

// Stacked bars: buckets = [{t, v: {key: n}}], defs = [{k, label, color}]; percent normalizes every bar to 100%.
function stacked(buckets, defs, percent) {
  const { W, L, R, T, B, H } = G, iw = W - L - R, ih = H - T - B, n = Math.max(buckets.length, 1), step = iw / n, w = Math.min(28, Math.max(2, step - 2));
  const tot = b => defs.reduce((a, d) => a + (b.v[d.k] || 0), 0);
  const max = percent ? 100 : Math.max(1, ...buckets.map(tot)), y = v => T + ih - v / max * ih;
  let body = '';
  buckets.forEach((b, i) => {
    const total = tot(b); let acc = 0; const x = L + step * i + (step - w) / 2;
    for (const d of defs) {
      const raw = b.v[d.k] || 0, v = percent ? (total ? raw / total * 100 : 0) : raw;
      if (v > 0) body += `<rect class="seg" data-k="${esc(d.k)}" x="${x}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v)}" fill="${d.color}"/>`;
      acc += v;
    }
  });
  // Focus: the series under the pointer keeps its colour in every column, all others fade; legend and hover card follow.
  let focus = null;
  const setFocus = k => {
    if (k === focus) return;
    focus = k;
    box.querySelectorAll('rect.seg').forEach(el => { el.style.opacity = k === null ? '' : (el.dataset.k === k ? '1' : '.18'); });
    box.querySelectorAll('.legend span').forEach(el => { el.style.opacity = k === null || el.dataset.k === k ? '' : '.4'; el.style.fontWeight = el.dataset.k === k ? '700' : ''; el.style.color = el.dataset.k === k ? 'var(--fg)' : ''; });
  };
  const box = bindTip(svgBox(axis(percent ? [0, 50, 100] : ticksFor(max), y, buckets.map(b => b.t), percent ? v => v + '%' : fmt) + body + hitRects(buckets.length, L, step, T, ih)), (i, e) => {
    const b = buckets[i], total = tot(b), val = (T + ih - svgPoint(box.querySelector('svg'), e).y) / ih * max;
    let acc = 0, active = null;   // walk this column's stack from the bottom to find the segment at the pointer
    for (const d of defs) { const raw = b.v[d.k] || 0, v = percent ? (total ? raw / total * 100 : 0) : raw; if (val >= acc && val < acc + v) { active = d.k; break; } acc += v; }
    setFocus(active);
    return { title: bucketTitle(b.t), rows: defs.filter(d => b.v[d.k]).map(d => ({ color: d.color, label: d.label, active: d.k === active, value: percent ? (b.v[d.k] / total * 100).toFixed(2) + '%' : num(b.v[d.k]) })) };
  }, () => setFocus(null));
  box.append(h('div', { class: 'legend' }, defs.map(d => h('span', { 'data-k': d.k }, h('i', { style: `background:${d.color}` }), d.label))));
  return box;
}

const bars = (rows, key, sub, label) => {
  const max = Math.max(1, ...rows.map(r => r[key]));
  return rows.length ? rows.map(r => h('div', { class: 'bar' },
    h('i', { style: `width:${r[key] / max * 100}%` }), h('span', {}, r.v === '' ? t('unknown') : label ? label(r.v ?? r.type) : r.v ?? r.type),
    h('span', {}, fmt(r[key]), sub ? sub(r) : ''))) : h('div', { class: 'mute' }, t('noData'));
};

// ---- refresh ----
// Manual refresh (default) and optional auto refresh only re-fetch data and update the current view in place.
const AUTO = [0, 10, 30, 60, 300];
let autoSec = 0, timer = null, runCurrent = null;
try { const v = +localStorage.getItem('autoSec'); if (AUTO.includes(v)) autoSec = v; } catch {}
function schedule() {
  clearInterval(timer);
  if (autoSec > 0 && runCurrent) timer = setInterval(() => { if (!document.hidden) runCurrent(); }, autoSec * 1000);
}
const nowLabel = () => new Date().toLocaleTimeString(loc());
// refresh: async () => void (throws on failure); returns [button, auto select, status] and registers the view for auto refresh.
function refreshControls(refresh, status) {
  let busy = false;
  const btn = h('button', { onclick: () => run() }, t('refresh'));
  const run = async () => {
    if (busy) return;
    busy = true; btn.disabled = true;
    try { await refresh(); status.textContent = t('updatedAt', nowLabel()); }
    catch (e) { if (e.message !== 'unauth') status.textContent = t('refreshFailed'); }
    finally { busy = false; btn.disabled = false; }
  };
  const sel = h('select', { title: t('autoRefresh'), onchange: e => {
    autoSec = +e.target.value;
    try { localStorage.setItem('autoSec', String(autoSec)); } catch {}
    schedule();
  } }, AUTO.map(v => h('option', { value: v, selected: v === autoSec }, v ? t('auto' + v) : t('autoOff'))));
  runCurrent = run;
  return [btn, sel, status];
}

// Shared layout of the data pages: range + live/test selects, refresh controls, and a content area that is re-filled on every fetch.
const RANGES = () => [[1, t('range1')], [7, t('range7')], [30, t('range30')], [90, t('range90')]];
async function liveView(app, tab, build) {
  const content = h('div'), status = h('span', { class: 'mute' });
  // build() may return null entries (e.g. no banner); replaceChildren would turn them into the text "null".
  const update = async () => content.replaceChildren(...(await build(curQ(app))).filter(Boolean));
  await update();
  status.textContent = t('updatedAt', nowLabel());
  const controls = refreshControls(update, status);
  const sel = (k, opts) => h('select', { onchange: e => { setQ(k, +e.target.value); controls[0].click(); } },
    opts.map(([v, l]) => h('option', { value: v, selected: v === getQ()[k] }, l)));
  return appShell(app, tab, h('div', { class: 'row' }, sel('days', RANGES()), sel('test', [[0, t('live')], [1, t('testData')]]), platformSelect(app, () => controls[0].click()), h('span', { class: 'sp' }), ...controls), content);
}

const card = (title, ...kids) => h('div', { class: 'card' }, h('h3', {}, title), ...kids);

// Weekly cohorts: share of each cohort that is active in the following weeks.
function retentionChart(r) {
  const cells = {}, cohorts = [...new Set(r.rows.map(x => x.cohort))].sort((a, b) => a - b), tips = [];
  for (const x of r.rows) (cells[x.cohort] ??= {})[x.n] = x.users;
  const cur = Math.floor((Date.now() + tzMin() * 60000 + r.mon_ms) / r.week_ms), cols = [...Array(8).keys()];
  if (!cohorts.length) return h('div', { class: 'mute' }, t('noData'));
  return bindTip(h('table', { class: 'heat' },
    h('thead', {}, h('tr', {}, h('th', {}, t('cohort')), cols.map(n => h('th', {}, t('weekN', n))))),
    h('tbody', {}, cohorts.map(c => {
      const monday = new Date(c * r.week_ms - r.mon_ms), size = cells[c][0] || 0, label = monday.toISOString().slice(0, 10);
      const first = monday.toLocaleDateString(loc(), { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
      return h('tr', {}, h('td', {}, label, h('span', { class: 'mute' }, ` · ${size}`)),
        cols.map(n => {
          if (c + n > cur || !size) return h('td', {});
          const users = cells[c][n] || 0, pct = users / size;
          tips.push({ lines: [{ text: t('retAfter', (pct * 100).toFixed(2), n) }, { text: t('retFirst', first) }, { text: t('retCount', users, size), mute: true }] });
          return h('td', { class: 'cell', 'data-i': tips.length - 1, style: `background:rgba(76,120,255,${(0.08 + 0.85 * pct).toFixed(2)})` }, Math.round(pct * 100) + '%');
        }));
    }))), i => tips[i]);
}

// Top 8 versions by users, everything else grouped as "other".
function versionsChart(rows, days) {
  const total = {}; for (const r of rows) total[r.v] = (total[r.v] || 0) + r.users;
  const top = Object.keys(total).sort((a, b) => total[b] - total[a]).slice(0, 8);
  const defs = top.map((v, i) => ({ k: v, label: v === '' ? t('unknown') : v, color: PALETTE[i] }));
  if (Object.keys(total).length > top.length) defs.push({ k: '__other', label: t('other'), color: OTHER });
  const by = {}; for (const r of rows) { const k = top.includes(r.v) ? r.v : '__other', b = (by[r.t] ??= {}); b[k] = (b[k] || 0) + r.users; }
  return stacked(bucketKeys(days).map(k => ({ t: k, v: by[k] || {} })), defs, true);
}

async function eventsView(app) {
  let kind = '', rows = [];
  try { kind = sessionStorage.getItem('evfilter') || ''; sessionStorage.removeItem('evfilter'); } catch {}
  const tbody = h('tbody'), more = h('button', {}, t('loadMore')), type = h('input', { placeholder: t('filterPh'), value: kind }), status = h('span', { class: 'mute' });
  const load = async (reset, force) => {
    const before = !reset && rows.length ? `&before=${rows.at(-1).id}` : '';
    const page = await api('GET', `/apps/${app.id}/events?limit=100&type=${encodeURIComponent(kind)}&platform=${encodeURIComponent(curQ(app).platform || '')}${before}`);
    // On refresh, leave the DOM alone when nothing is new so expanded parameters stay open (new events always have a larger id).
    if (reset && !force && rows.length && page[0]?.id === rows[0].id) return;
    if (reset) { rows = []; tbody.replaceChildren(); }
    rows.push(...page);
    for (const r of page) tbody.append(h('tr', {},
      h('td', {}, when(r.ts), r.is_test ? ' 🧪' : ''), h('td', {}, r.type),
      h('td', { class: 'mute' }, [r.app_version, osLabel(r), r.device_model, r.country && [countryName(r.country), cityName(r.city)].filter(Boolean).join(' / ')].filter(Boolean).join(' · ')),
      h('td', { class: 'm' }, r.payload === '{}' ? '' : params(r.payload))));
    more.style.display = page.length < 100 ? 'none' : '';
  };
  await load(true, true);
  status.textContent = t('updatedAt', nowLabel());
  const controls = refreshControls(() => load(true), status);
  type.addEventListener('keydown', e => { if (e.key === 'Enter') { kind = type.value.trim(); load(true, true); } });
  more.addEventListener('click', () => load(false));
  return appShell(app, 'events', h('div', { class: 'row' }, type, platformSelect(app, () => load(true, true)), h('span', { class: 'mute' }, t('filterHint')), h('span', { class: 'sp' }), ...controls),
    h('div', { class: 'card', style: 'overflow:auto' }, h('table', {}, h('thead', {}, h('tr', {}, ['colTime', 'colEvent', 'colEnv', 'colParams'].map(x => h('th', {}, t(x))))), tbody)), more);
}

// Prompt for AI coding agents, filled with this server's URL, the app id and (once issued) the write key.
// Keep in sync with docs/AGENT_PROMPT*.md.
const agentPrompt = (app, key) => t('agentPrompt').split('<SERVER_URL>').join(location.origin).split('<APP_ID>').join(app.id).split('<WRITE_KEY>').join(key || '<WRITE_KEY>');

async function settingsView(app) {
  const name = h('input', { value: app.name }), days = h('input', { type: 'number', value: app.retention_days, style: 'width:90px' });
  // The key name is required; it defaults to the current local time, e.g. "2026-11-08 06:20".
  const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const label = h('input', { placeholder: t('keyLabelPh'), value: stamp(), maxlength: 100 }), fresh = h('div'), labelErr = h('span', { class: 'mute', style: 'color:var(--danger)' });
  // The key list is re-fetched and redrawn on its own, so a freshly issued key card stays on screen.
  const keysBody = h('tbody');
  const loadKeys = async () => keysBody.replaceChildren(...(await api('GET', `/apps/${app.id}/keys`)).map(k => h('tr', {}, h('td', {}, k.label), h('td', { class: 'm' }, k.prefix + '…'), h('td', {}, when(k.created_at)),
    h('td', {}, k.revoked_at ? h('span', { class: 'mute' }, t('revoked')) : h('a', { onclick: async () => { if (confirm(t('revokeConfirm'))) { await api('DELETE', `/keys/${k.id}`); await loadKeys(); } } }, t('revoke'))))));
  await loadKeys();
  const origin = location.origin;
  const promptBox = h('textarea', { readonly: true, rows: 14, spellcheck: 'false' }), promptNote = h('div', { class: 'mute' }, t('agentNoKey')), copied = h('span', { class: 'mute' });
  promptBox.value = agentPrompt(app, null);
  const copyPrompt = async () => {
    try { await navigator.clipboard.writeText(promptBox.value); } catch { promptBox.select(); document.execCommand('copy'); }
    copied.textContent = t('agentCopied'); setTimeout(() => { copied.textContent = ''; }, 2000);
  };
  let issuing = false;
  const mk = async () => {
    if (issuing) return;
    if (!label.value.trim()) { labelErr.textContent = t('labelRequired'); label.focus(); return; }
    labelErr.textContent = ''; issuing = true;
    let key;
    try { ({ key } = await api('POST', `/apps/${app.id}/keys`, { label: label.value.trim() })); }
    catch (e) { if (e.message !== 'unauth') labelErr.textContent = t('refreshFailed'); return; }
    finally { issuing = false; }
    promptBox.value = agentPrompt(app, key); promptNote.textContent = t('agentKeyFilled');
    fresh.replaceChildren(h('div', { class: 'card warn' }, h('div', { class: 'warn-title' }, '⚠ ' + t('newKeyTitle')), h('pre', { class: 'keybox' }, key),
      h('h3', {}, 'TelemetryDeck SDK (Swift)'),
      h('pre', {}, `let config = TelemetryDeck.Config(appID: "${app.id}", baseURL: URL(string: "${origin}/k/${key}/")!)\nTelemetryDeck.initialize(config: config)`),
      h('h3', {}, 'OpenTelemetry (OTLP/HTTP Logs)'),
      h('pre', {}, `OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${origin}/v1/logs\nOTEL_EXPORTER_OTLP_LOGS_PROTOCOL=http/protobuf\nOTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer ${key}`)));
    label.value = stamp();
    await loadKeys();
  };
  return appShell(app, 'settings',
    h('div', { class: 'card' }, h('h3', {}, t('basicInfo')), h('div', { class: 'row' }, name, t('retention'), days, t('daysUnit'),
      h('button', { class: 'p', onclick: async () => { await api('PATCH', `/apps/${app.id}`, { name: name.value, retention_days: +days.value }); route(); } }, t('save'))),
      h('div', { class: 'mute' }, t('appId'), app.id)),
    h('div', { class: 'card' }, h('h3', {}, t('writeKeys')),
      h('div', { class: 'row' }, label, h('button', { class: 'p', onclick: mk }, t('issueKey')), labelErr), fresh,
      h('table', {}, h('thead', {}, h('tr', {}, ['colLabel', 'colPrefix', 'colCreated', ''].map(x => h('th', {}, x && t(x))))), keysBody)),
    h('div', { class: 'card' }, h('h3', {}, t('agentTitle')), h('div', { class: 'mute', style: 'margin-bottom:8px' }, t('agentHint')), promptBox,
      h('div', { class: 'row', style: 'margin:8px 0 0' }, h('button', { class: 'p', onclick: copyPrompt }, t('agentCopy')), copied, h('span', { class: 'sp' }), promptNote)),
    h('div', { class: 'card' }, h('h3', {}, t('danger')),
      h('button', { class: 'd', onclick: async () => { if (confirm(t('deleteConfirm', app.name))) { await api('DELETE', `/apps/${app.id}`); location.hash = '#/'; } } }, t('deleteApp'))));
}

const VIEWS = { overview: overviewView, users: usersView, events: eventsView, types: typesView, errors: errorsView, settings: settingsView };
async function route() {
  clearInterval(timer); runCurrent = null;
  const parts = location.hash.slice(2).split('/');
  try {
    let view;
    if (parts[0] === 'login') view = loginView();
    else if (parts[0] === 'app' && parts[1]) {
      const [app, summary, apps, platforms] = await Promise.all([api('GET', `/apps/${parts[1]}`), api('GET', `/apps/${parts[1]}/summary`), api('GET', '/apps'), api('GET', `/apps/${parts[1]}/platforms`)]);
      app.summary = summary; app.apps = apps; app.platforms = platforms;
      view = await (VIEWS[parts[2]] || overviewView)(app);
    } else view = await appsView();
    $app.replaceChildren(view);
    schedule();
  } catch (e) { if (e.message !== 'unauth') $app.replaceChildren(h('main', {}, h('div', { class: 'card' }, t('error') + e.message))); }
}
addEventListener('hashchange', () => { scrollTo(0, 0); route(); });
route();
</script>
